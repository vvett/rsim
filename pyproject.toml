[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "rsim"
version = "0.1.0"
description = "Python bindings for a C++ six-degree-of-freedom rocket simulation library"
requires-python = ">=3.9"

[tool.scikit-build]
wheel.packages = ["python/rsim"]
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
RSIM_BUILD_PYTHON = "ON"
RSIM_BUILD_DEMO = "OFF"
RSIM_BUILD_TESTS = "OFF"
